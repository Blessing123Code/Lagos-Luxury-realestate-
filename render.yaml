services:
  - type: web
    name: lagos-luxury-realestate
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn Property_listing.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
